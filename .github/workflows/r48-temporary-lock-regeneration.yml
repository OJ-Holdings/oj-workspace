name: R48 temporary manifest regeneration
on:
  pull_request:
    paths:
      - '.github/workflows/r48-temporary-lock-regeneration.yml'
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate patched Next.js dependency lock
        run: |
          npm install next@16.4.1 --save-exact --package-lock-only --ignore-scripts --no-audit
          node - <<'NODE'
          const fs = require('fs');
          for (const [tag,path] of [['PKG','package.json'],['LOCK','package-lock.json']]) {
            console.log('R48_BEGIN_'+tag);
            const value=fs.readFileSync(path).toString('base64');
            for (let n=0;n<value.length;n+=2000)console.log('R48_'+tag+'_CHUNK '+value.slice(n,n+2000));
            console.log('R48_END_'+tag);
          }
          NODE
