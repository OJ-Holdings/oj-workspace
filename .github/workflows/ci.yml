name: CI

on:
  push:
    branches: [main]
  pull_request:

# When implementation pushes multiple revisions to the same PR, only the
# newest PR commit matters. Cancel superseded PR runs (and their failure
# notifications) but NEVER cancel a production/main check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
