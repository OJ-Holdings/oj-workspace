name: CI

on:
  push:
    branches: [main]
  pull_request:

# When implementation pushes multiple revisions to the same PR, only the
# newest PR commit matters. Cancel superseded PR runs (and their failure
# notifications) but NEVER cancel a production/main check.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  private-backup-acl:
    name: Private backup folder permissions (Windows synthetic)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: ./scripts/tests/backup-private-acl.Tests.ps1

  content-studio-synthetic:
    name: Content Studio staged schema and RLS (synthetic PostgreSQL 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/tests/content-studio-integration.sh
      - run: bash scripts/tests/content-studio-integration.sh

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate PowerShell backup and deployment helpers parse
        shell: pwsh
        run: |
          $scripts = @(
            'scripts/backup-supabase-windows.ps1',
            'scripts/backup-supabase-storage-windows.ps1',
            'scripts/install-postgresql-client-windows.ps1',
            'scripts/install-age-windows.ps1',
            'scripts/install-supabase-backup-task.ps1',
            'scripts/verify-production-windows.ps1',
            'scripts/restore-supabase-isolated.ps1',
            'scripts/restore-supabase-docker-drill.ps1',
            'scripts/tests/restore-supabase-isolated.Tests.ps1',
            'scripts/tests/restore-supabase-docker-drill.Tests.ps1',
            'scripts/exterior-r40-recovery-preflight.ps1',
            'scripts/tests/exterior-r40-recovery-preflight.Tests.ps1',
            'scripts/tests/age-stream-helper-smoke.ps1',
            'scripts/exterior-p2-release-evidence.ps1',
            'scripts/lib/exterior-p2-release-evidence.ps1',
            'scripts/tests/exterior-p2-release-evidence.Tests.ps1'
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script).Path, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error ("PowerShell parser: " + $_.Message) }
              throw ("Invalid PowerShell syntax in " + $script)
            }
          }
      - name: Reject unsafe isolated restore targets (offline, no credentials)
        shell: pwsh
        run: ./scripts/tests/restore-supabase-isolated.Tests.ps1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify binary private Storage encryption, corruption and refusal (synthetic)
        run: python -m unittest discover -s scripts/tests -p test_storage_recovery.py -v
      - name: Validate disposable Docker restore isolation guards (offline)
        shell: pwsh
        run: ./scripts/tests/restore-supabase-docker-drill.Tests.ps1
      - name: Validate founder recovery preflight trust boundary (offline)
        shell: pwsh
        run: ./scripts/tests/exterior-r40-recovery-preflight.Tests.ps1
      - name: Validate P2 release and public origin trust boundary (offline)
        shell: pwsh
        run: ./scripts/tests/exterior-p2-release-evidence.Tests.ps1
      - run: npm ci
      # Fail closed on known critical dependency advisories instead of merely
      # printing npm ci's audit notice and still shipping the vulnerable build.
      - name: Block critical dependency advisories
        run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  isolated-restore-synthetic:
    name: Synthetic isolated PostgreSQL 17 recovery (no production data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise guarded restore against two temporary PostgreSQL 17 databases
        shell: bash
        run: bash scripts/tests/restore-synthetic-integration.sh

  exterior-p3-staging-synthetic:
    name: P3 staging schema + actual RLS actors (synthetic PostgreSQL 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse isolated P3 staging harness
        run: bash -n scripts/tests/exterior-p3-schema-integration.sh
      - name: Test real tenant RLS, revocation, immutable versions and work-order receipt
        shell: bash
        run: bash scripts/tests/exterior-p3-schema-integration.sh

  commercial-estimating-synthetic:
    name: Commercial estimating RPCs + actual RLS actors (synthetic PostgreSQL 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse isolated commercial-estimate harness
        run: bash -n scripts/tests/oj-commercial-estimate-integration.sh
      - name: Test shared versions, tenant roles, cost privacy, conflicts and idempotency
        shell: bash
        run: bash scripts/tests/oj-commercial-estimate-integration.sh
